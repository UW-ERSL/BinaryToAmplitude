[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "multiplexed_state_preparation"
version = "0.1.0"
description = "Multiplexed state preparation by CORDIC arithmetic: entries from the index bits, amplitudes from the entries"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.setuptools]
packages = ["multiplexed_state_preparation"]
