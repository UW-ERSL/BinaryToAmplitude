[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "binary_to_amplitude"
version = "0.1.0"
description = "Binary-to-amplitude conversion of a vector by a tree of CORDIC vectorings"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.setuptools]
packages = ["binary_to_amplitude"]
